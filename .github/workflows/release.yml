name: Release rime-tiger

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Verify source
        env:
          LUA: lua5.4
          LUAC: luac5.4
        run: tools/check.sh portable
      - name: Build release package
        run: python3 tools/package.py "$RUNNER_TEMP/rime.zip" --lua lua5.4
      - name: Generate release notes
        run: |
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          previous_sha=
          if [[ -n "$previous" ]]; then
            previous_sha="$(git show "$previous:models/sentence-ngram-mobile.meta.yaml" 2>/dev/null | sed -n 's/^sha256: "\([0-9a-f]\{64\}\)"$/\1/p')"
          fi
          current_sha="$(sed -n 's/^sha256: "\([0-9a-f]\{64\}\)"$/\1/p' models/sentence-ngram-mobile.meta.yaml)"
          model_flag=
          if [[ "$previous_sha" != "$current_sha" ]]; then
            model_flag=--model-changed
          fi
          python3 tools/release_notes.py "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release-notes.md" $model_flag
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/rime.zip" \
            --title "rime-tiger $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
