name: Release rime-tiger

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Verify source
        env:
          LUA: lua5.4
          LUAC: luac5.4
        run: tools/check.sh portable
      - name: Build release package
        run: python3 tools/package.py "$RUNNER_TEMP/rime.zip" --lua lua5.4
      - name: Generate release notes
        run: >-
          python3 tools/release_notes.py "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/release-notes.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/rime.zip" \
            --title "rime-tiger $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
