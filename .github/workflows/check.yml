name: Check Rime

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check for generated lexicons in source
        run: test -z "$(git ls-files lua/tiger_sentence/data/lexicon.bin lua/tiger_sentence/data/ranks.lua)"
      - name: Verify source
        env:
          LUA: lua5.4
          LUAC: luac5.4
        run: tools/check.sh portable
      - name: Test packaging
        run: python3 tests/package.py --lua lua5.4
